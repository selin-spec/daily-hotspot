const DEMO={"config": {"models": {"seedance 2.0": 15, "seedance 2.5": 30}}, "library": {"date": "2026-11-19", "items": [{"id": 0, "hook": "她一开口全是东北话,豪门寿宴上,所有人都等着看她出丑", "title": "少夫人来自东北3", "platform": "红果短剧", "highlight": "海外豪门寿宴上,堂哥当众嘲笑她土,她端起酒杯一开口,满桌长辈全被逗笑,反倒冷落了堂哥", "conflict": "土味儿媳进海外豪门,被排挤后靠真性情翻盘", "route": "剧情-身份设定", "adapt": "高"}, {"id": 1, "hook": "为了救女儿,他把一块拳头大的金子,藏进了最不可能的地方", "title": "嫌疑人的秘密2藏金生死线", "platform": "红果短剧", "highlight": "矿场出口层层搜身,工友突然举手举报他,保安走到他面前,金子就藏在离保安手边最近的地方", "conflict": "父亲私藏金块闯过层层搜查,还被工友举报", "route": "剧情-猎奇设定", "adapt": "高"}, {"id": 2, "hook": "十八岁的少女一进门,全家人跪下喊她:太奶奶", "title": "十八岁太奶奶驾到，重整家族荣耀第五部", "platform": "红果短剧", "highlight": "势利前妻上门认亲,全家穿着旧衣服装穷,开门的少女淡淡一句,全家起身喊她太奶奶", "conflict": "年轻外表的太奶奶带全家扮穷,试探前妻真心", "route": "剧情-身份设定", "adapt": "高"}, {"id": 3, "hook": "那些欠他家钱不还的人,把他爸逼上了天台,这一次,他上门收债了", "title": "诚信第一，我在都市找老赖们收债", "platform": "红果短剧", "highlight": "当年逼债害死父亲的人正在办酒席,他推门进去,把一叠借条拍在了主桌上", "conflict": "富二代被欠债者害得家破,拜师后挨家收债", "route": "解说词-复仇", "adapt": "高"}, {"id": 4, "hook": "圣旨念完,外室母子正得意,她缓缓拿出一叠地契", "title": "侯爷临终扶庶子上位，圣旨赐下后他慌了", "platform": "红果短剧", "highlight": "侯爷病床前宣读圣旨,外室母子正得意,她慢慢拿出一叠地契,侯府的产业早已全在她名下", "conflict": "被看轻的正妻暗中转移家产,临终局面被她反转", "route": "解说词-隐藏身份", "adapt": "高"}, {"id": 5, "hook": "兄弟大婚那天,他穿着工装赴宴,掏出了一张儿时写下的字据", "title": "做兄弟，在心中", "platform": "红果短剧", "highlight": "婚宴上他穿着工装,掏出儿时字据要二十万,新娘当场拍桌,兄弟却默默掏出了银行卡", "conflict": "用童年约定试探发达兄弟,新娘当场翻脸", "route": "剧情-争执", "adapt": "高"}, {"id": 6, "hook": "父母不让她读书,镇上那个没文化的杀猪匠,却拿出了全部积蓄", "title": "一把杀猪刀，供出女状元", "platform": "红果短剧", "highlight": "父母撕了她的录取通知书,杀猪匠把油腻的钱袋往桌上一放:这书,我供", "conflict": "重男轻女家庭里的女孩,被陌生杀猪匠供成状元", "route": "解说词-怎么变富翁", "adapt": "高"}, {"id": 7, "hook": "中秋夜,浑身湿透的继子站在门口,她挺着孕肚", "title": "温柔以待，终有回甘", "platform": "红果短剧", "highlight": "中秋夜门铃响,浑身湿透的继子站在门口,她挺着孕肚把孩子拉进门,转身给前妻打了电话", "conflict": "继母收留被亲妈苛待的继子", "route": "剧情-身份设定", "adapt": "高"}, {"id": 8, "hook": "年会上丈夫搂着情人炫耀,她走上了台", "title": "高调离婚，叶太太她又狠又硬", "platform": "红果短剧", "highlight": "丈夫带着情人在公司年会上炫耀,她走上台,宣布他被开除了", "conflict": "白手起家的女强人被丈夫背叛后高调离婚", "route": "解说词-复仇", "adapt": "高"}, {"id": 9, "hook": "家宴上七套房全给小儿子,丈夫放下了筷子", "title": "分你七套房，我调去新疆", "platform": "红果短剧", "highlight": "家宴上公婆宣布七套房全给小儿子,还要大儿子养老,丈夫放下筷子,拿出一张调令", "conflict": "偏心公婆分房,长子用一纸调令反将一军", "route": "剧情-争执", "adapt": "高"}, {"id": 10, "hook": "他以为她不知道代持,她笑着签了字", "title": "错失的遗憾", "platform": "红果短剧", "highlight": "他以为她不知道代持的算盘,她笑着把房产转给了他的下属,手续刚办完,她又拿出了一份文件", "conflict": "丈夫想借人代持房产,被妻子识破反设局", "route": "解说词-复仇", "adapt": "高"}, {"id": 11, "hook": "他跳楼那一刻,撞上了一个从火星来的女孩", "title": "二龙湖浩哥之我的外星女友", "platform": "红果短剧", "highlight": "他站在楼顶纵身一跳,半空中撞上了一个发光的女孩,两人一起悬在了半空", "conflict": "绝望的中年人被外星女孩救下并改命", "route": "剧情-猎奇设定", "adapt": "高"}, {"id": 12, "hook": "他一睁眼,成了村里打老婆的无赖,门后,母女俩正发着抖", "title": "穿越八零，我把娘俩宠成宝", "platform": "红果短剧", "highlight": "他睁眼时手里正握着皮带,门后的母女缩成一团,他把皮带扔出门外,蹲下来说:别怕", "conflict": "现代人穿成家暴丈夫,决心护住母女", "route": "剧情-身份设定", "adapt": "高"}, {"id": 13, "hook": "她亲手捧红了闺蜜,却被闺蜜推下了站台", "title": "nova：新星", "platform": "红果短剧", "highlight": "她刚捧红的闺蜜在站台上搂住她,下一秒,用力把她推向了驶来的列车", "conflict": "被背叛的制作人重生后重回舞台", "route": "解说词-复仇", "adapt": "高"}, {"id": 14, "hook": "女总裁瞧不起新来的保镖,直到那天,有人朝她开了枪", "title": "退役归来，这个保镖不好惹", "platform": "红果短剧", "highlight": "女总裁当众训斥新保镖,枪声响起,他一把将她按倒,反手夺下了杀手的枪", "conflict": "低调保镖被高傲女总裁看轻,危机中亮出身手", "route": "解说词-隐藏身份", "adapt": "高"}, {"id": 15, "hook": "同学会上,所有人都笑他是养猪的,他只是,默默付了全场的账", "title": "同学会笑我乡下养猪，却不知我身价过亿", "platform": "红果短剧", "highlight": "同学会上老同学嘲笑他开破皮卡,他起身去结账,经理却恭敬地喊他:董事长", "conflict": "低调的亿万董事长在同学会被嘲讽", "route": "解说词-隐藏身份", "adapt": "高"}, {"id": 16, "hook": "女儿被推下海的那一刻,她纵身跳了下去", "title": "千禧渔娘：离婚后我的看潮眼能寻满海珍宝", "platform": "红果短剧", "highlight": "丈夫在新买的游轮上,和情人一起把亲生女儿推下了海,她纵身跳下去救", "conflict": "被丈夫抛弃的女人带女儿回海边,靠看潮能力翻身", "route": "解说词-复仇", "adapt": "高"}, {"id": 17, "hook": "她替丈夫守了十年寡,却发现,他根本没死", "title": "穿书70年代：死去的丈夫回来了！", "platform": "红果短剧", "highlight": "她守寡十年后,在镇上撞见了死去的丈夫,他正牵着另一个女人的手", "conflict": "穿越成守寡媳妇,识破婆家骗局后反击", "route": "剧情-身份设定", "adapt": "高"}, {"id": 18, "hook": "三岁的她独自走进派出所:我是来找爸爸的", "title": "小安寻亲：萌崽的幸福攻略", "platform": "红果短剧", "highlight": "三岁的她独自走进派出所,踮脚对警察说:我是来找爸爸的", "conflict": "萌娃独自寻父并撮合父母复合", "route": "剧情-身份设定", "adapt": "高"}, {"id": 19, "hook": "死亡考场的门打开,走进来一个戴手铐的人", "title": "全球死考：刚下刑场你让我去考试一季", "platform": "红果短剧", "highlight": "死亡考场上,所有考生都在发抖,门开了,戴着手铐的死刑犯走了进来,坐在第一排", "conflict": "死亡考试里,死刑犯成了所有人的希望", "route": "剧情-猎奇设定", "adapt": "高"}, {"id": 20, "hook": "她吝啬了十几年,儿子大婚,全村人提着鸡蛋和韭菜来随礼", "title": "一场酒席，映出全村人的心意", "platform": "红果短剧", "highlight": "吝啬的她等着婚宴收礼金,全村乡亲提着鸡蛋和韭菜进门,一个红包都没有", "conflict": "吝啬的母亲想借婚宴收礼,被全村回敬", "route": "剧情-争执", "adapt": "高"}, {"id": 21, "hook": "金融峰会上,抛弃她们的前任坐在台下", "title": "四宝相伴，我逆袭成商界执棋者", "platform": "红果短剧", "highlight": "金融峰会台上她从容演讲,台下坐着当年抛下她们母女的前任,他手里的笔掉了", "conflict": "被抛弃的单亲妈妈成为商界强者,前任峰会重逢后悔", "route": "解说词-复仇", "adapt": "高"}, {"id": 22, "hook": "毕业那天白月光提分手,他笑着点开了手机", "title": "供白月光上岸，被斩万倍返还", "platform": "红果短剧", "highlight": "毕业那天白月光当面提分手,他笑着点开手机,十三亿到账,一辆会飞的车停在了两人面前", "conflict": "舔狗被分手后触发系统,金钱碾压前任", "route": "解说词-怎么变富翁", "adapt": "高"}, {"id": 23, "hook": "她被推下游轮,海面下有什么东西托住了她", "title": "说我不孕?我给海神生了八个孩子", "platform": "ShortMax", "highlight": "体重两百磅的她被丈夫和继妹推下游轮,海面上,一条巨大的鱼尾托住了她", "conflict": "被嫌弃的妻子遭谋害后被海神所救", "route": "剧情-猎奇设定", "adapt": "高"}, {"id": 24, "hook": "从不开口的小女孩,突然扑进她怀里", "title": "嫁给黑帮老大,他的自闭症女儿叫我妈妈", "platform": "ShortMax", "highlight": "从不开口的小女孩,在所有人面前扑进她怀里,喊了一声妈妈,黑帮老大愣住了", "conflict": "替家还债的继母打动孤僻的女孩", "route": "剧情-身份设定", "adapt": "高"}, {"id": 25, "hook": "妈妈昏迷了,双胞胎砸了存钱罐,去买一个爸爸", "title": "我们买了妈妈的前任当爸爸", "platform": "ShortMax", "highlight": "一对双胞胎抱着存钱罐走进黑帮大楼,把硬币倒在老大桌上:我们要买你当爸爸", "conflict": "萌娃用零花钱雇佣妈妈的前任", "route": "剧情-身份设定", "adapt": "高"}, {"id": 26, "hook": "她每次失忆,男友就换一个人来冒充自己", "title": "第九次失忆,我选了他最好的兄弟", "platform": "ShortMax", "highlight": "她第九次失忆醒来,男友又安排兄弟冒充自己,她却直接牵起了那个兄弟的手", "conflict": "男友利用女友失忆骗了她三年", "route": "解说词-复仇", "adapt": "高"}, {"id": 27, "hook": "养女当众笑她土,她只是抬了抬眼", "title": "替换黑帮千金?没门!", "platform": "ShortMax", "highlight": "黑帮女王找回失散十八年的女儿,养女当众嘲笑她土,她一个眼神,全场保镖拔了枪", "conflict": "真千金回归被养女排挤", "route": "解说词-隐藏身份", "adapt": "高"}, {"id": 28, "hook": "手术室的灯亮了,主刀医生是被赶走的她", "title": "医学天才不好惹", "platform": "ShortMax", "highlight": "丈夫带着情人和私生子把她赶出家门,三个月后,丈夫病危,推进手术室,主刀医生是她", "conflict": "被背叛的妻子重拾医术逆袭", "route": "解说词-复仇", "adapt": "高"}, {"id": 29, "hook": "男友在抽签游戏里作弊,只为和白月光同住", "title": "地下男友选了他的白月光,我官宣了别人", "platform": "ShortMax", "highlight": "毕业旅行抽签分房,男友做了手脚要和白月光同住,她当场拉过另一个男生:我们一间", "conflict": "被地下恋人背叛后当场反击", "route": "剧情-争执", "adapt": "高"}, {"id": 30, "hook": "未婚夫和闺蜜,把她失明的父亲当成了赌注", "title": "婚礼当天我走了,复仇开始", "platform": "ShortMax", "highlight": "婚礼上她发现未婚夫和闺蜜拿她失明的父亲打赌,她扯下头纱,牵着父亲走出了教堂", "conflict": "新娘在婚礼当天识破背叛", "route": "解说词-复仇", "adapt": "高"}, {"id": 31, "hook": "所有人笑他是废物,他走上了拳台", "title": "六百磅的废物,其实是拳王", "platform": "GoodShort", "highlight": "所有人嘲笑六百磅的他是废物,他走上拳台,一拳把挑衅的人打出了围绳", "conflict": "隐藏身份的拳王被看轻后出手", "route": "解说词-隐藏身份", "adapt": "高"}, {"id": 32, "hook": "她的葬礼上,全家人只关心遗产", "title": "我的葬礼,是这个家的终点", "platform": "GoodShort", "highlight": "她的葬礼上,全家人在争遗产,遗嘱念出来那一刻,所有人都哭不出来了", "conflict": "被家人辜负的女儿留下反转遗嘱", "route": "解说词-复仇", "adapt": "高"}, {"id": 33, "hook": "三岁被扔进暴雪,她抱住了一个冻僵的人", "title": "三岁被扔进暴雪,我救了冬之王", "platform": "ReelShort", "highlight": "三岁的她光着脚被扔进暴风雪,她抱住一个冻僵的陌生人取暖,天亮时,陌生人睁开了金色的眼睛", "conflict": "被抛弃的孩子救下了冬之王", "route": "剧情-猎奇设定", "adapt": "高"}, {"id": 34, "hook": "亲奶奶卖掉了妈妈,还说她不值钱", "title": "和妈妈一起被卖给了疤脸猎人", "platform": "ReelShort", "highlight": "奶奶把妈妈卖了二十个铜板,指着她说不值钱,疤脸猎人却把两个都抱上了马", "conflict": "被亲人卖掉的母女遇到真心人", "route": "剧情-身份设定", "adapt": "高"}, {"id": 35, "hook": "传说娶过的七个新娘,都没活过新婚夜", "title": "我被诅咒的人鱼丈夫统治深海", "platform": "ReelShort", "highlight": "七任新娘都在新婚夜死去,她推开婚房的门,床上的公爵,长着一条鱼尾", "conflict": "嫁给怪物公爵的新娘发现他的秘密", "route": "剧情-猎奇设定", "adapt": "高"}, {"id": 36, "hook": "她复明的那天,看清了每晚照顾她的人", "title": "男友的哥哥叫我宝贝", "platform": "ShortMax", "highlight": "失明的她视力慢慢恢复,看清了每晚照顾她的人,不是男友,而是他那个黑帮教父哥哥", "conflict": "冒名照顾的真相被揭开", "route": "剧情-身份设定", "adapt": "高"}, {"id": 37, "hook": "男人带着新欢上门嘲讽,她拨通了电话", "title": "别惹女亿万富翁", "platform": "GoodShort", "highlight": "她隐藏金融集团总裁的身份默默付出,当男人带着新欢上门嘲讽,她拨通电话,一整个集团都听她指挥", "conflict": "为爱隐瞒身份的女总裁被背叛后摊牌", "route": "解说词-隐藏身份", "adapt": "高"}, {"id": 38, "hook": "全校孩子的面前,他把她扛上了车", "title": "她那么骄", "platform": "红果短剧", "highlight": "山区学校的操场上,他带着人把她拦下,当着全校孩子的面,把她扛上了车", "conflict": "被迫定亲的两人,从对抗到动心", "route": "解说词-甜蜜恋爱", "adapt": "中"}, {"id": 39, "hook": "领证后,一排豪车停在出租屋楼下", "title": "闪婚神秘老公", "platform": "红果短剧", "highlight": "领证后她回到出租屋,一排豪车停在楼下,司机恭敬地喊她:太太", "conflict": "普通女孩闪婚身份神秘的商业精英", "route": "解说词-隐藏身份", "adapt": "中"}, {"id": 40, "hook": "残疾王爷提剑要自尽,她扑了上去", "title": "母凭子贵后被皇家宠上天3", "platform": "红果短剧", "highlight": "残疾王爷提剑要自尽,她扑上去用身体挡住剑锋,剑尖停在她心口一寸", "conflict": "被退婚的女子嫁给残疾王爷,以命相护", "route": "解说词-甜蜜恋爱", "adapt": "中"}, {"id": 41, "hook": "他被师父从山上扔下来,正好砸在了总裁大小姐身上", "title": "冰山美女太高傲，老子专治大美女", "platform": "红果短剧", "highlight": "他从天而降砸在总裁身上,下一秒,远处的狙击枪响了,他抱着她滚到了桌子底下", "conflict": "下山青年救下被暗杀的总裁并治好她的腿", "route": "剧情-猎奇设定", "adapt": "中"}, {"id": 42, "hook": "火车站,他数着仅剩的八十五块,手机亮了", "title": "莞城人生", "platform": "红果短剧", "highlight": "火车站,他数着手里仅剩的八十五块,手机亮起,是前女友发来的结婚照", "conflict": "被背叛的青年靠手艺在异乡翻身", "route": "解说词-怎么变富翁", "adapt": "中"}, {"id": 43, "hook": "他推开家门,母亲正在给别人洗碗", "title": "大佬修仙满级回现代，我让全家横着走", "platform": "红果短剧", "highlight": "他推开家门,头发花白的母亲正在给人洗碗,他跪了下来,一个电话打出去,催债的人全跑了", "conflict": "修仙归来的儿子回家守护受苦的家人", "route": "解说词-特殊技能", "adapt": "中"}, {"id": 44, "hook": "他一眼看出村长有病,村长不信", "title": "山野杏林，助乡兴家", "platform": "红果短剧", "highlight": "他落水后血滴进玉石,醒来时一眼看出村长的病,村长不信,半小时后跪着来求他", "conflict": "农村青年得奇遇懂医术,带全村致富", "route": "解说词-特殊技能", "adapt": "中"}, {"id": 45, "hook": "婆家丢来一盆馊菜,她系上了围裙", "title": "悍妻当家，靠美食扶起一家软骨头", "platform": "红果短剧", "highlight": "婆家把馊掉的剩菜丢给她,她系上围裙,一锅菜出锅,全村人闻着香味围到了门口", "conflict": "现代主厨穿越成村妇,靠厨艺撑起全家", "route": "解说词-特殊技能", "adapt": "中"}, {"id": 46, "hook": "他走进精神病院,病床上的人抬起了头", "title": "我救了顾家，他们却丢了我儿子", "platform": "红果短剧", "highlight": "他归国后走进精神病院,病床上的女人抬起头,正是他找了十三年的妻子", "conflict": "归国男人查清狸猫换子的阴谋", "route": "解说词-复仇", "adapt": "中"}, {"id": 47, "hook": "法庭上亲妈抢她为了钱,后妈蹲下来抱住她", "title": "被抛弃的女孩有了家", "platform": "红果短剧", "highlight": "法庭上亲妈抢抚养权只为了钱,后妈蹲下来抱住她:跟我回家", "conflict": "被生母利用的孩子在后妈身边长大", "route": "剧情-身份设定", "adapt": "中"}, {"id": 48, "hook": "魔域大军压境,他系着围裙走出厨房", "title": "和离后我带女儿横扫魔域", "platform": "红果短剧", "highlight": "魔域大军压境,他系着围裙从厨房走出来,一挥锅铲,魔军全部跪下", "conflict": "隐退魔帝带着女儿重返魔域", "route": "解说词-隐藏身份", "adapt": "中"}, {"id": 49, "hook": "极品亲戚来抢粮,她推出一口空米缸", "title": "末世重生七零，空间异能加持搬空搬空", "platform": "红果短剧", "highlight": "极品亲戚上门抢粮,她把空米缸推给他们看,转身从空间里搬出一屋子粮食", "conflict": "末世强者重生七零,带着空间对付极品亲戚", "route": "解说词-特殊技能", "adapt": "中"}, {"id": 50, "hook": "她半夜收拾行李,一开门,他正倚在门口", "title": "婚后娇养，偏执大佬的掌心宠第二季", "platform": "红果短剧", "highlight": "她半夜收拾行李准备跑路,一开门,男主正倚在门口,笑着问她去哪", "conflict": "穿成恶毒女配想跑,却被偏执男主宠住", "route": "解说词-甜蜜恋爱", "adapt": "中"}, {"id": 51, "hook": "她一眼看出,那个总裁身上的病,不是病", "title": "学法律的玄学大师，很常见吗第三季", "platform": "红果短剧", "highlight": "她第一次见总裁,一眼看到他背后趴着个东西,她掏出一张符,贴在了他肩上", "conflict": "玄学女法师与怪病总裁绑定互救", "route": "解说词-特殊技能", "adapt": "中"}, {"id": 52, "hook": "别人被异兽追着跑,三岁的她坐在地上", "title": "萌娃锦鲤三岁半，荒界异兽排队送宝箱", "platform": "红果短剧", "highlight": "生存赛开局,别人被异兽追着跑,三岁的她坐在地上,一群异兽排队给她送宝箱", "conflict": "被看轻的萌娃靠好运碾压全场", "route": "解说词-特殊技能", "adapt": "中"}, {"id": 53, "hook": "妻子不敢接他的钱,他蹲下去徒手摸向泥滩", "title": "一颗龙珠，换你一世安稳（全文完结）", "platform": "红果短剧", "highlight": "妻子连他递来的钱都不敢接,他蹲在泥滩上徒手掏出一只巨蟹,放进她手里的空篮子", "conflict": "重生赌徒靠奇珠赚钱,想换回妻女的信任", "route": "剧情-猎奇设定", "adapt": "中"}, {"id": 54, "hook": "他带着女儿去比武招亲,所有人都当他是乞丐", "title": "全家族开战", "platform": "ShortMax", "highlight": "穷小子带着女儿去比武招亲,女总裁当众嫌他是乞丐,他一出手,擂台上的人全飞了出去", "conflict": "被看轻的穷小子在擂台上亮出真本事", "route": "解说词-隐藏身份", "adapt": "中"}, {"id": 55, "hook": "她去应聘继母,开门的是黑帮老大", "title": "黑帮老大雇我当妻子", "platform": "ShortMax", "highlight": "被前夫嫌丑抛弃的她去应聘继母,开门的是黑帮老大,他看了她一眼:明天就结婚", "conflict": "被抛弃的女人意外嫁入黑帮豪门", "route": "剧情-身份设定", "adapt": "中"}, {"id": 56, "hook": "她重生回婚后第七天,前世的仇人上门了", "title": "重生后,我选了冷酷的黑帮老大", "platform": "ShortMax", "highlight": "她重生回婚后第七天,前世出卖她的男人又来献殷勤,她当着他的面,吻了自己的丈夫", "conflict": "重生女主改选真心人", "route": "解说词-复仇", "adapt": "中"}, {"id": 57, "hook": "他当众让她,向回归的初恋道歉", "title": "教父的伤心情人", "platform": "ShortMax", "highlight": "教父的初恋回来了,他当众让她给初恋道歉,她摘下项链放在桌上,转身离开", "conflict": "被抛弃的情人决然离开", "route": "解说词-复仇", "adapt": "中"}, {"id": 58, "hook": "又被要求把东西让给姐姐,她放下了钥匙", "title": "失去我,才懂爱我", "platform": "GoodShort", "highlight": "又一次被要求把东西让给双胞胎姐姐,她把房门钥匙放在桌上,头也不回地走了", "conflict": "被偏心的妹妹离家", "route": "剧情-争执", "adapt": "中"}, {"id": 59, "hook": "家族宴会上,她被当众宣布逐出家门", "title": "被断绝关系的女儿", "platform": "GoodShort", "highlight": "家族宴会上,她被当众宣布逐出家门,她摘下家族徽章,扔进了香槟塔", "conflict": "被逐出家门的女儿反击", "route": "解说词-复仇", "adapt": "中"}, {"id": 60, "hook": "她被绑在树上羞辱,月亮升了起来", "title": "狼王残忍的考验之后", "platform": "ReelShort", "highlight": "她被命定伴侣和继姐绑在树上羞辱,月亮升起时,她的眼睛变成了狼的颜色", "conflict": "被霸凌的少女觉醒力量", "route": "剧情-争执", "adapt": "中"}, {"id": 61, "hook": "守护她家六十年,换来一句:废物", "title": "海神的伪装", "platform": "ReelShort", "highlight": "为报六十年前的救命之恩,海神伪装成渔夫守护恩人一家,恩人的孙女却当众骂他是废物", "conflict": "隐藏身份的海神被看轻", "route": "解说词-隐藏身份", "adapt": "中"}, {"id": 62, "hook": "混混来面包店收保护费,不知道老板是谁", "title": "隐藏的暴君:在西西里烤面包的退休教父", "platform": "DramaBox", "highlight": "小镇面包店老板被混混勒索,他擦了擦手上的面粉,混混们认出了他", "conflict": "隐藏身份的教父被逼出手", "route": "解说词-隐藏身份", "adapt": "中"}, {"id": 63, "hook": "对方家长正嚣张,孩子的妈妈走了进来", "title": "怕了吧,我妈是女老板", "platform": "DramaBox", "highlight": "孩子在学校被欺负,对方家长嚣张,孩子妈妈走进来,对方家长的脸白了", "conflict": "护子母亲亮出身份", "route": "解说词-隐藏身份", "adapt": "中"}, {"id": 64, "hook": "亿万富翁当众撕碎支票,骂她是拜金女", "title": "被当成拜金女", "platform": "GoodShort", "highlight": "她为了救孤儿院去求助亿万富翁,他一口咬定她是拜金女,当众把支票撕碎,她却没有走", "conflict": "被误会的女孩与讨厌拜金者的富豪", "route": "剧情-身份设定", "adapt": "中"}]}, "prompts": {"P-A 分析原片": "你是短剧投放素材分析师。请分析一部短剧原片,提取制作\"前贴\"所需的信息。\n前贴是接在原片开头之前的一段短视频,讲一个与原片不同的小故事,结尾自然落到原片第一个场景;前贴中人物的脸要与原片相同。\n\n【输入信息】\n1. 原片时长:{{时长}}秒,剧名:{{剧名}}\n2. 原片画面抽帧拼图(每格左上角是该帧在原片中的秒数),请用读取图片的工具逐张查看:\n{{画面拼图}}\n3. 人脸分组拼图:程序把原片中检测到的人脸按相似度分了组,每格下方写着组编号和出现次数,请逐张查看:\n{{人脸拼图}}\n   各组出现的时间点:{{人脸分组}}\n4. 原片语音转写(带时间,可能有识别错误;为空表示没有转写):\n{{语音转写}}\n\n【输出要求】\n先用工具读完所有图片,再只输出一份JSON,放在 <<<JSON 和 JSON>>> 之间,不要输出其他解释:\n<<<JSON\n{\n  \"一句话剧情\": \"不超过60字,讲清谁、遇到什么事、最大的冲突\",\n  \"原片开头\": \"原片第一个场景:地点、在场人物(用角色编号)、人物状态和情绪、发生了什么,不超过80字\",\n  \"角色\": [\n    {\"编号\": \"A\", \"人脸组\": \"G1\", \"名字\": \"没有出现写未知\", \"定位\": \"女主/男主/男二/女配/其他\", \"人设\": \"身份、处境、性格或能力,一句话,不超过30字\"}\n  ],\n  \"衔接点\": [\n    {\"方式\": \"因果衔接/情绪衔接/悬念衔接/画面衔接\", \"说明\": \"前贴结尾停在什么状态能接上原片开头,不超过40字\"}\n  ]\n}\nJSON>>>\n\n【规则】\n1. 角色最多5个,按重要程度排序,优先男主和女主;识别出几个就写几个,不凑数。\n2. \"人脸组\"填该角色对应的组编号;同一个人只能对应一个组,一个组只能对应一个角色;实在对不上的写空字符串。\n3. 名字只来自字幕、名字卡或语音里能确定指向此人的称呼,不得编造。\n4. 衔接点给2到3个,方式尽量不同,只依据原片开头,不得编造原片中没有的内容。\n5. 只依据看到和听到的内容,不得推测原片后续剧情。\n", "P-R 推荐钩子": "你是短剧投放素材编辑。请从\"短剧高光钩子库\"里,为下面这部原片挑选正好3条最适合嫁接到前贴里的钩子。\n\n【原片信息】\n一句话剧情:{{一句话剧情}}\n原片开头:{{原片开头}}\n角色人设:{{角色人设}}\n衔接点:{{衔接点}}\n\n【钩子库】(每行:编号 | 钩子 | 高光场面 | 核心冲突)\n{{钩子库}}\n\n【挑选标准】\n1. 钩子的冲突或爽点能用原片的角色演出来(身份、关系、处境对得上)。\n2. 钩子的结尾状态能落到原片开头,或者与某个衔接点契合。\n3. 3条钩子的切入角度要不同(例如一条复仇打脸、一条身份反差、一条悬念)。\n4. 优先爽点强、冲突明确、30秒内能讲清的钩子。\n\n【输出要求】\n只输出一份JSON,放在 <<<JSON 和 JSON>>> 之间:\n<<<JSON\n{\"推荐\": [{\"编号\": 0, \"理由\": \"不超过30字,说明它和原片哪里对得上\"}]}\nJSON>>>\n必须正好3条,编号必须来自钩子库。\n", "P-C 生成创作思路(按钩子剧情扩展)": "你是短剧投放素材的爆款编剧。请把3条短剧高光钩子,分别扩展成3个\"前贴\"创作思路(版本一用钩子1,版本二用钩子2,版本三用钩子3)。\n\n【3条钩子(每条都来自已跑量的短剧,前贴的主要剧情就是它)】\n{{钩子}}\n\n【原片信息(只用于选人和写结尾衔接)】\n一句话剧情:{{一句话剧情}}\n原片开头:{{原片开头}}\n角色人设(出场人物只能来自这里,用编号指代):\n{{角色人设}}\n衔接点:{{衔接点}}\n\n【视频参数】\n视频模型:{{模型}};前贴总时长:{{时长}}秒(所有节拍的时长加起来必须正好等于{{时长}}秒)\n\n【写法要求】\n1. 主要剧情就是钩子的剧情:把钩子的\"高光时刻\"扩展成一个完整的小故事(起因、升级、高光场面爆发),\n   \"高光时刻\"里的关键事件、关键动作、反转必须原样出现,\"核心冲突\"不得改变。不得换成原片的剧情或别的故事。\n2. 换人不换戏:把钩子里的人物对应到原片里身份、性别、关系最接近的角色,写清\"钩子里的谁 → 原片角色编号\"。\n   画面里人物的脸用原片角色的参考图,只写角色编号,不写五官长相。\n3. 只在结尾微微衔接原片:最后约3秒,让剧情走向、画面(地点、服装、动作、光线)或一句台词,自然引向原片开头;\n   衔接要轻,不得为了衔接把钩子剧情改掉。写清用的是哪种衔接、怎么接上的。\n4. 前3秒就要出现钩子里最抓人的冲突或画面;每3到5秒升一级;爽点就是钩子的高光时刻,写清在第几秒爆发。\n5. 内容边界:擦边只靠眼神、距离、身份差暗示;冲突只到推搡、泼水、下跪的程度;不出现真实人名、公司、地名;\n   画面里不得出现任何需要显示的文字。\n6. 视频生成提示词不少于300字:画幅9:16、风格色调、光线、每个镜头的时长、景别、机位与运镜、人物动作表情、\n   服装场景、声音(旁白音色、台词语气、环境音),写明\"人物A参考图A\"的对应关系,最后写清禁止项。\n   每个镜头必须写出这个镜头里的旁白和台词原文(与脚本节拍里的\"台词或旁白\"逐字一致,用引号括起),并写明说话人、音色和语气,\n   例如:旁白(冷峻女声,语速偏快):\"……\";人物C(得意轻笑):\"……\";没有旁白和台词的镜头写\"本镜头无旁白无台词\"。\n\n【输出要求】\n只输出一份JSON,放在 <<<JSON 和 JSON>>> 之间:\n<<<JSON\n{\n  \"创作思路\": [\n    {\n      \"版本名称\": \"版本一\",\n      \"使用钩子\": 1,\n      \"标题钩子\": \"不超过30字,沿用钩子的说法\",\n      \"人物对应\": [{\"钩子人物\": \"如:新娘\", \"原片角色\": \"A\"}],\n      \"保留的钩子剧情\": \"一句话,说明照搬了钩子的哪条主线和哪个高光场面\",\n      \"创作路线\": \"解说词/剧情/跑量剧情延伸,加子类\",\n      \"爽点\": \"就是钩子的高光时刻,写清在第几秒爆发\",\n      \"故事梗概\": \"不超过80字\",\n      \"出场角色\": [\"A\"],\n      \"衔接设计\": {\"衔接方式\": \"剧情/画面/台词\", \"前贴结尾状态\": \"最后几秒的画面和台词\", \"为什么接得上\": \"不超过40字\"},\n      \"脚本节拍\": [{\"时间\": \"0-4秒\", \"画面\": \"\", \"台词或旁白\": \"\"}],\n      \"视频生成提示词\": \"不少于300字,每个镜头含旁白和台词原文\"\n    }\n  ]\n}\nJSON>>>\n", "P-P 视频生成提示词": "你是AI视频提示词工程师。下面是一条前贴的最终脚本,请据此重写一条可以直接交给视频模型的完整提示词。\n\n视频模型:{{模型}};总时长:{{时长}}秒;画幅9:16\n出场角色(人物A参考图A,以此类推):\n{{角色人设}}\n标题钩子:{{标题}}\n脚本节拍:\n{{节拍}}\n\n要求:不少于300字;按镜头逐个写明时长、景别、机位与运镜、人物动作和表情、服装与场景细节、光线色调、声音(旁白音色、台词语气、环境音);人物只写编号并说明参考图;最后写清禁止项(不出现文字、字幕、水印、多余人脸)。\n只输出提示词正文,放在 <<<TEXT 和 TEXT>>> 之间。\n", "P-V 拆解爆款": "你是短剧投放素材分析师。下面是一条已经跑量的\"爆款前贴\"视频,请拆解它的结构。\n\n【输入信息】\n1. 爆款视频时长:{{时长}}秒\n2. 画面抽帧拼图(每格左上角是秒数),请用读取图片的工具逐张查看:\n{{画面拼图}}\n3. 语音转写(带时间,可能有识别错误;为空表示没有转写):\n{{语音转写}}\n\n【输出要求】\n先读完所有图片,再只输出一份JSON,放在 <<<JSON 和 JSON>>> 之间:\n<<<JSON\n{\n  \"一句话内容\": \"这条爆款讲了什么,不超过50字\",\n  \"开头钩子\": \"前3秒用了什么手段抓人,不超过40字\",\n  \"爽点\": \"爽点是什么、在第几秒爆发,不超过40字\",\n  \"结构\": [\n    {\"时间\": \"0-5秒\", \"作用\": \"钩子/升级/反转/揭晓/收尾\", \"画面要点\": \"这一段的画面和动作,不超过40字\"}\n  ]\n}\nJSON>>>\n结构切成4到6段,时间连续并覆盖整条视频。只描述看到和听到的内容,不得推测。\n", "P-B 爆款仿写(换脸复刻)": "你是短剧投放素材的爆款编剧。请把一条已经跑量的爆款前贴\"换脸复刻\"成新的前贴:\n剧情照着爆款走,人物换成原片的角色,结尾改成能接上原片开头。\n\n【爆款拆解】\n一句话内容:{{爆款内容}}\n开头钩子:{{爆款钩子}}\n爽点:{{爆款爽点}}\n结构(按时间):\n{{爆款结构}}\n\n【原片信息】\n一句话剧情:{{一句话剧情}}\n原片开头:{{原片开头}}\n角色人设(出场人物只能来自这里,用编号指代):\n{{角色人设}}\n衔接点:{{衔接点}}\n\n【视频参数】\n视频模型:{{模型}};前贴总时长:{{时长}}秒(所有节拍的时长加起来必须正好等于{{时长}}秒)\n\n【写法要求】\n1. 核心剧情必须是爆款的剧情:事件顺序、关键情节、反转、爽点和钩子都照爆款走,不得换成别的故事。\n   爆款里的每一段结构,前贴里都要有对应的一段,时间按{{时长}}秒等比例换算。\n2. 换人不换戏:把爆款里的每个人物,对应到原片里身份、性别、关系最接近的角色,写清\"爆款里的谁 → 原片角色编号\"。\n   画面里人物的脸用原片角色的参考图,只写角色编号,不写五官长相。\n3. 只改结尾:最后一段(约 function pick(id){if(S.hooks.length>=3){alert("推荐钩子最多 3 条,请先删除一条推荐钩子,再选用");return}S.hooks.push({...LIB.items.find(x=>x.id==id),reason:"手动选择"});render()}
async function putImg(file){if(file.size>3*1024*1024)throw new Error("演示版图片请小于 3MB");return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error("图片读取失败"));r.readAsDataURL(file)})}
async function roleImg(i,f){if(!f)return;try{S.roles[i].img=await putImg(f);render()}catch(e){alert(e.message)}}
async function addRole(f){if(!f)return;try{const u=await putImg(f);const used=new Set(S.roles.map(r=>r.code));const code=[..."ABCDEFG"].find(c=>!used.has(c));S.roles.push({code,name:"",pos:"",persona:"",img:u});render()}catch(e){alert(e.message)}}

/* ---------- 第三步 ---------- */
async function creative(auto){try{S.max=1;S.creative=[];S.ver=null;S.step=1;S._hk=JSON.stringify(S.hooks.map(h=>h.id));S.job=await post(`/api/job/${S.job.id}/creative`,{analysis:S.analysis,roles:S.roles,hooks:S.hooks});render();poll()}catch(e){alert(e.message)}}
function ideas(){const t=T("creative"),changed=S._hk&&S._hk!=JSON.stringify(S.hooks.map(h=>h.id));
 let h=`<div class="card"><h3>创作思路 <span class="muted">每条钩子扩展成一个版本:剧情照钩子走,人物换成原片角色,结尾接原片</span></h3>`;
 if(t.status=="running")h+=`<div class="prog" style="padding:6px 0"><span class="spin"></span><b>${esc(t.stage||"正在生成")}</b></div>`;
 else if(t.status=="error")h+=`<div class="err">出错了:${esc(t.error)}</div>`;
 else if(!S.creative.length)h+=`<div class="muted">选满 3 条钩子后生成</div>`;
 else h+=`<div class="grid3">${S.creative.map((v,i)=>{const hk=S.hooks[(v["使用钩子"]||i+1)-1];return `<div class="ver ${S.ver===i?"on":""}" onclick="S.ver=${i};render()">
 <div class="muted">${esc(v["版本名称"])} · 使用钩子${v["使用钩子"]||i+1}</div>
 <input class="tt" type="text" value="${esc(v["标题钩子"])}" onclick="event.stopPropagation()" oninput="S.creative[${i}]['标题钩子']=this.value">
 ${hk?`<div class="muted" style="line-height:1.6;background:#f7f9fc;border-radius:6px;padding:6px 9px"><b>钩子剧情</b>:${esc(hk.highlight)}</div>`:""}
 ${v["保留的钩子剧情"]?`<div style="font-size:13px;line-height:1.6"><b>扩展剧情</b>:${esc(v["保留的钩子剧情"])}</div>`:""}
 <div class="shuang"><b>爽点</b>:${esc(v["爽点"])}</div>
 <div style="line-height:1.65">${esc(v["故事梗概"])}</div>
 ${(v["人物对应"]||[]).length?`<div class="muted" style="line-height:1.9"><b>换脸</b>:${v["人物对应"].map(x=>`${esc(x["钩子人物"])} → ${av(x["原片角色"])}`).join("　")}</div>`:""}
 <div class="muted"><b>与原片衔接</b>(${esc((v["衔接设计"]||{})["衔接方式"])}):${esc((v["衔接设计"]||{})["前贴结尾状态"])}</div>
 <div style="display:flex;gap:6px;align-items:center">${(v["出场角色"]||[]).map(av).join("")}<span class="muted">出场角色</span></div></div>`}).join("")}</div>`;
 h+=`</div><div class="acts">${changed?`<span class="warn">钩子已更换,请重新生成创作思路</span>`:""}<button class="btn ghost" onclick="S.step=0;render()">上一步</button>
 <button class="btn ghost" ${S.hooks.length==3&&t.status!="running"?"":"disabled"} onclick="creative()">${changed?"按新钩子重新生成":"都不满意,重新生成"}</button>
 <button class="btn" ${S.ver===null||changed||t.status=="running"?"disabled":""} onclick="S.edit=JSON.parse(JSON.stringify(S.creative[S.ver]));S.step=3;render()">选这个版本</button></div>`;
 return h}
function step2v(){const p=progress("rewrite","rewrite()");if(p)return p+`<div class="acts"><button class="btn ghost" onclick="S.step=1;render()">上一步</button></div>`;
 const v=S.creative[0];if(!v)return `<div class="card">尚未生成</div>`;
 return `<div class="card"><div class="muted">爆款仿写 · 剧情照爆款走,人物换成原片角色,结尾接原片</div>
 <input class="tt" type="text" value="${esc(v["标题钩子"])}" style="font-weight:700;font-size:15px;margin:10px 0" oninput="S.creative[0]['标题钩子']=this.value">
 <dl class="kv" style="margin-bottom:10px"><dt>保留的爆款剧情</dt><dd>${esc(v["保留的爆款剧情"])}</dd>
 <dt>人物对应</dt><dd>${(v["人物对应"]||[]).map(x=>`爆款里的${esc(x["爆款人物"])} → ${av(x["原片角色"])} ${esc(x["原片角色"])}`).join("　")}</dd>
 <dt>故事梗概</dt><dd>${esc(v["故事梗概"])}</dd></dl><div class="shuang"><b>爽点</b>:${esc(v["爽点"])}</div>
 <div class="muted" style="margin-top:10px;line-height:1.7"><b>与原片衔接</b>(${esc((v["衔接设计"]||{})["衔接方式"])}):${esc((v["衔接设计"]||{})["前贴结尾状态"])}<br>${esc((v["衔接设计"]||{})["为什么接得上"])}</div>
 <div style="display:flex;gap:6px;align-items:center;margin:10px 0">${(v["出场角色"]||[]).map(av).join("")}<span class="muted">出场角色</span></div>
 <table><tr><th style="width:80px">时间</th><th style="width:110px">对应爆款段落</th><th>画面</th><th style="width:28%">台词或旁白</th></tr>${(v["脚本节拍"]||[]).map(b=>`<tr><td>${esc(b["时间"])}</td><td class="muted">${esc(b["对应爆款段落"]||"")}</td><td>${esc(b["画面"])}</td><td>${esc(b["台词或旁白"])}</td></tr>`).join("")}</table></div>
 <div class="acts"><button class="btn ghost" onclick="S.step=1;render()">上一步</button><button class="btn ghost" onclick="rewrite()">不满意,重新仿写</button>
 <button class="btn" onclick="S.ver=0;S.edit=JSON.parse(JSON.stringify(S.creative[0]));S.step=3;render()">确认,去调整</button></div>`}

/* ---------- 第四步 ---------- */
function total(){return Math.max(0,...(S.edit["脚本节拍"]||[]).map(b=>{const m=(b["时间"]||"").match(/\d+(\.\d+)?/g);return m?+m[m.length-1]:0}))}
function rwCard(){const v=S.creative[0];if(!v)return "";
 return `<div class="card"><h3>爆款仿写 <span class="muted">剧情照爆款走,人物换成原片角色,结尾接原片</span></h3><dl class="kv">
 <dt>保留的爆款剧情</dt><dd>${esc(v["保留的爆款剧情"])}</dd>
 <dt>人物对应</dt><dd>${(v["人物对应"]||[]).map(x=>`爆款里的${esc(x["爆款人物"])} → ${av(x["原片角色"])} ${esc(x["原片角色"])}`).join("　")}</dd>
 <dt>故事梗概</dt><dd>${esc(v["故事梗概"])}</dd><dt>爽点</dt><dd>${esc(v["爽点"])}</dd>
 <dt>与原片衔接</dt><dd>${esc((v["衔接设计"]||{})["衔接方式"])}:${esc((v["衔接设计"]||{})["前贴结尾状态"])}</dd></dl>
 <div class="acts" style="margin-top:12px"><button class="btn ghost sm" onclick="rewrite()">不满意,重新仿写</button></div></div>`}
function step3(){if(isV()){const p=progress("rewrite","rewrite()");if(p)return p+`<div class="acts"><button class="btn ghost" onclick="S.step=1;render()">上一步</button></div>`;
  if(!S.edit)return `<div class="card">尚未生成仿写</div><div class="acts"><button class="btn ghost" onclick="S.step=1;render()">上一步</button></div>`;
  return rwCard()+step3body()}
 return step3body()}
function step3body(){const v=S.edit,lim=S.job.meta.seconds,cast=S.roles.filter(r=>(v["出场角色"]||[]).includes(r.code)),t=total();
 return `<div class="card"><h3>资产图与参数</h3><div class="thumbs">
 ${cast.map(r=>`<div class="thumb">${r.img?`<img src="${r.img}" onclick="zoom('${r.img}')">`:`<span class="ph2"></span>`}<div class="muted" style="margin-top:4px">${esc(r.code)} ${esc(r.pos)}</div>
  <label class="muted" style="color:#2E6DB4;cursor:pointer">更换<input type="file" accept="image/*" hidden onchange="roleImg(${S.roles.indexOf(r)},this.files[0])"></label></div>`).join("")}
 ${S.scenes.map(u=>`<div class="thumb"><img src="${u}" onclick="zoom('${u}')"><div class="muted" style="margin-top:4px">场景图</div></div>`).join("")}
 <label class="thumb" style="cursor:pointer"><span class="ph2" style="display:flex;align-items:center;justify-content:center;border:1.5px dashed #cfd6e2;color:#9ca3af">+ 场景图</span><input type="file" accept="image/*" hidden onchange="addScene(this.files[0])"></label></div>
 <div class="grid3" style="margin-top:16px"><div><label class="f">BGM</label><select onchange="S.bgm=this.value">${["紧张悬疑","爽感燃","虐心抒情","轻快","不加BGM"].map(x=>`<option ${x==S.bgm?"selected":""}>${x}</option>`).join("")}</select></div>
 <div><label class="f">是否需要字幕</label><select onchange="S.subs=this.value=='需要'">${["需要","不需要"].map(x=>`<option ${(x=="需要")==S.subs?"selected":""}>${x}</option>`).join("")}</select></div>
 <div><label class="f">分辨率</label><input type="text" value="统一 1080×1920(9:16)" disabled></div></div></div>
 <div class="card"><h3>脚本 <span class="muted">${esc(S.job.meta.model)} · 前贴时长 ${lim} 秒,时间只能在 0 到 ${lim} 秒内修改</span></h3>
 <label class="f">标题钩子</label><input type="text" value="${esc(v["标题钩子"])}" oninput="S.edit['标题钩子']=this.value" style="margin-bottom:12px;font-weight:600">
 <table><tr><th style="width:96px">时间</th><th>画面描述</th><th style="width:30%">台词或旁白</th></tr>
 ${(v["脚本节拍"]||[]).map((b,i)=>`<tr><td><input type="text" value="${esc(b["时间"])}" onchange="S.edit['脚本节拍'][${i}]['时间']=this.value;render()"></td>
 <td><textarea oninput="S.edit['脚本节拍'][${i}]['画面']=this.value">${esc(b["画面"])}</textarea></td><td><textarea oninput="S.edit['脚本节拍'][${i}]['台词或旁白']=this.value">${esc(b["台词或旁白"])}</textarea></td></tr>`).join("")}</table>
 ${t>lim?`<div class="warn" style="margin-top:8px">节拍结束时间 ${t} 秒,超过了模型上限 ${lim} 秒,请调整</div>`:""}
 <div style="margin-top:16px;display:flex;justify-content:space-between;align-items:end"><label class="f" style="margin:0">视频生成提示词</label>
 <button class="btn ghost sm" ${T("prompt").status=="running"?"disabled":""} onclick="rePrompt()">${T("prompt").status=="running"?"正在重写…":"按修改后的脚本重写提示词"}</button></div>
 <textarea style="min-height:200px;margin-top:6px" oninput="S.edit['视频生成提示词']=this.value">${esc(v["视频生成提示词"])}</textarea>
 ${T("prompt").status=="error"?`<div class="err" style="margin-top:8px">${esc(T("prompt").error)}</div>`:""}</div>
 <div class="acts"><button class="btn ghost" onclick="S.step=1;render()">上一步</button><button class="btn" ${t>lim?"disabled":""} onclick="S.step=4;S.job.teaser='';render()">确认,去生成</button></div>`}
async function addScene(f){if(!f)return;try{S.scenes.push(await putImg(f));render()}catch(e){alert(e.message)}}
async function rePrompt(){try{S._wantPrompt=true;S.job=await post(`/api/job/${S.job.id}/prompt`,{version:S.edit});render();poll()}catch(e){alert(e.message)}}

/* ---------- 第五步 ---------- */
function step4(){const j=S.job,sp=T("splice");
 return `<div class="card"><h3>前贴视频</h3><div style="display:flex;gap:24px;align-items:flex-start">
 <div class="video">${j.teaser?`<video src="${j.teaser}" controls></video>`:`<div class="muted" style="margin-bottom:14px">视频生成为模拟</div><button class="btn" onclick="sim()">模拟已生成视频</button>`}</div>
 <div style="display:flex;flex-direction:column;gap:10px">
  <div><b>【${esc(S.edit["标题钩子"])}】</b></div><div class="muted">${esc(j.meta.model)} · ${j.meta.seconds} 秒 · 1080×1920 · ${S.subs?"带字幕":"无字幕"} · BGM:${esc(S.bgm)}</div>
  ${j.teaser?`<a class="btn ghost" href="${j.teaser}&dl=1">下载前贴视频</a>`:""}
  <button class="btn ghost" onclick="S.step=3;render()">不满意,返回修改</button></div></div></div>
 ${sp.status=="running"?`<div class="card prog"><span class="spin"></span><b>${esc(sp.stage||"正在拼接")}</b></div>`:""}
 ${sp.status=="error"?`<div class="card"><div class="err">拼接出错:${esc(sp.error)}</div></div>`:""}
 ${j.final?`<div class="card"><h3>成片</h3><video src="${j.final}" controls style="width:240px;border-radius:8px"></video><div style="margin-top:10px"><a class="btn" href="${j.final}&dl=1">下载成片</a></div></div>`:""}
 ${(j.mirrors||[]).length?`<div class="card"><h3>镜像任务</h3>${j.mirrors.map(m=>`<div style="line-height:2.2">${esc(m.lang)} 镜像前贴 · 原片:${esc(m.src)} · <span class="muted">字幕翻译为模拟</span> <a href="${m.url}&dl=1">下载</a></div>`).join("")}</div>`:""}
 <div class="acts"><button class="btn" ${j.teaser&&sp.status!="running"?"":"disabled"} onclick="splice()">确认成片</button><button class="btn ghost" ${j.teaser?"":"disabled"} onclick="S.mirrorOpen=true;render()">镜像任务</button></div>
 ${S.mirrorOpen?`<div class="modal"><div class="box"><h3 style="margin:0 0 6px">镜像任务</h3><div class="muted">相同前贴内容,字幕换成其他语言</div>
 <div class="chk">${["英语","西班牙语","葡萄牙语","日语","韩语","印尼语","泰语","阿拉伯语"].map(l=>`<label><input type="checkbox" value="${l}" class="ml"> ${l}</label>`).join("")}</div>
 <label class="f">重新选择原片(选填,不选则用当前原片)</label><input type="file" accept="video/*" id="msrc">
 <div class="acts" style="margin-top:18px"><button class="btn ghost" onclick="S.mirrorOpen=false;render()">取消</button><button class="btn" onclick="mirror()">创建镜像任务</button></div></div></div>`:""}`}
async function sim(){try{S.job=await post(`/api/job/${S.job.id}/simulate`,{version:S.edit,subtitles:S.subs});render()}catch(e){alert(e.message)}}
async function splice(){try{S.job=await post(`/api/job/${S.job.id}/splice`);render();poll()}catch(e){alert(e.message)}}
async function mirror(){const langs=[...document.querySelectorAll(".ml:checked")].map(x=>x.value);if(!langs.length){alert("请至少选择一种语言");return}
 const f=$("#msrc").files[0];try{S.job=await post(`/api/job/${S.job.id}/mirror`,{langs,src_name:f?f.name:""});S.mirrorOpen=false;render()}catch(e){alert(e.message)}}

/* ---------- 其他页 ---------- */
function promptPage(){const ks=Object.keys(PROMPTS);pk=pk||ks[0];return `<div style="display:grid;grid-template-columns:200px 1fr;gap:20px"><div class="plist">${ks.map(k=>`<a class="${k==pk?"on":""}" onclick="pk='${k}';render()">${esc(k)}</a>`).join("")}</div><pre>${esc(PROMPTS[pk]||"")}</pre></div>`}

let HIST={origin:[],viral:[]},HIST_OPEN=false,_saveT=null,_saved="";
async function refreshHist(){try{const m=isV()?"viral":"origin";HIST[m]=await api("/api/jobs?mode="+m);if(STATES[tab])render()}catch(e){}}
function ago(t){const d=new Date(t*1000),p=n=>String(n).padStart(2,"0");return `${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`}
function histBar(){const m=isV()?"viral":"origin";return `<div class="histbar"><button class="histbtn" onclick="openHist()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 3 9 9 9"/><polyline points="12 7 12 12 15 14"/></svg>创作历史<span class="n">${HIST[m].length}</span></button></div>`}
async function openHist(){HIST_OPEN=true;await refreshHist();render()}
function histDrawer(){if(!HIST_OPEN||!STATES[tab])return "";const m=isV()?"viral":"origin",L=HIST[m];
 return `<div class="modal" style="background:#0003" onclick="HIST_OPEN=false;render()"></div><div class="drawer"><div class="hd"><b>创作历史 · ${isV()?"爆款复刻":"原片理解"}</b><span style="cursor:pointer;color:#6b7280;font-size:18px" onclick="HIST_OPEN=false;render()">×</span></div>
 <div class="bd">${L.map(x=>`<div class="hi ${S.job&&S.job.id==x.id?"cur":""}" onclick="openJob('${x.id}')"><div style="display:flex;justify-content:space-between;gap:8px"><b style="word-break:break-all">${esc(x.name)}</b><span class="tag ${x.progress=="已出成片"?"g":x.progress=="仅上传"||x.progress=="分析中"?"y":""}" style="white-space:nowrap">${esc(x.progress)}</span></div>
 ${x.viral?`<div class="muted" style="margin-top:4px">爆款:${esc(x.viral)}</div>`:""}${x.title?`<div style="margin-top:6px;line-height:1.5">【${esc(x.title)}】</div>`:""}
 <div class="muted" style="margin-top:6px">${ago(x.updated)}${x.model?" · "+esc(x.model)+" · "+x.seconds+"秒":""}${S.job&&S.job.id==x.id?" · 当前任务":""}</div></div>`).join("")||`<div class="muted">还没有历史任务</div>`}</div></div>`}
async function openJob(id){try{const j=await api("/api/job/"+id),n=mkS(),run=Object.values(j.tasks||{}).some(t=>t.status=="running");
 n.job=j;n.model=j.meta.model||Object.keys(CFG.models).slice(-1)[0];n.seconds=j.meta.seconds||0;n.title=j.meta.title||"";n.episodes=j.meta.episodes||"第1集";n.tags=j.meta.tags||"";
 n.analysis=j.analysis;n.roles=j.roles||[];n.hooks=j.hooks||[];n.breakdown=j.breakdown||null;n.creative=j.creative||[];
 if(j.ui)Object.assign(n,j.ui);else{n.step=j.final||j.teaser?4:n.creative.length?2:(j.analysis||run)?1:0;if(j.confirmed){n.edit=j.confirmed;n.ver=0}}
 if(n.step>=3&&!n.edit)n.step=n.creative.length?2:1;n.max=Math.max(n.max||0,n.step);
 const mode=j.meta.mode||(j.meta.viral?"viral":"origin");STATES[mode]=n;tab=mode;S=n;HIST_OPEN=false;_saved="";render();if(run)poll(n)}catch(e){alert(e.message)}}
function autosave(){if(!S.job||!S.analysis)return;const ui={step:S.step,max:S.max,ver:S.ver,edit:S.edit,bgm:S.bgm,subs:S.subs,scenes:S.scenes};
 const b={ui,roles:S.roles,hooks:S.hooks};if(S.creative.length)b.creative=S.creative;const k=JSON.stringify(b);if(k==_saved)return;
 clearTimeout(_saveT);const id=S.job.id;_saveT=setTimeout(()=>post(`/api/job/${id}/save`,b).then(()=>{_saved=k}).catch(()=>{}),1200)}
function render(){nav();if(STATES[tab])S.max=Math.max(S.max||0,S.step);
 if(tab=="lib"){$("#page").innerHTML=`<iframe src="library.html"></iframe>`;return}
 const body=tab=="prompt"?promptPage():histBar()+steps()+[step0,step1,isV()?step3:step1,step3,step4][S.step]()+histDrawer();
 const keep=document.activeElement&&document.activeElement.id;$("#page").innerHTML=`<div class="wrap">${body}</div>`;if(STATES[tab])autosave();
 const d=$("#drop");if(d){d.ondragover=e=>{e.preventDefault();d.classList.add("drag")};d.ondragleave=()=>d.classList.remove("drag");d.ondrop=e=>{e.preventDefault();d.classList.remove("drag");upload(e.dataTransfer.files[0])}}}
(async()=>{CFG=await api("/api/config");Object.values(STATES).forEach(s=>s.model=Object.keys(CFG.models).slice(-1)[0]);LIB=await api("/api/library");PROMPTS=await api("/api/prompts");HIST.origin=await api("/api/jobs?mode=origin");HIST.viral=await api("/api/jobs?mode=viral");render()})();
</script></body></html>
